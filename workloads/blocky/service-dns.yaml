apiVersion: v1
kind: Service
metadata:
  name: blocky-dns
  labels:
    app: blocky
  annotations:
    metallb.universe.tf/loadBalancerIPs: "10.0.4.241"
spec:
  type: LoadBalancer
  selector:
    app: blocky
  ports:
    - port: 53
      targetPort: dns-tcp
      protocol: TCP
      name: dns-tcp
    - port: 53
      targetPort: dns-udp
      protocol: UDP
      name: dns-udp
