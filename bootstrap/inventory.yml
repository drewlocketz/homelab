k3s_cluster:
  children:
    server:
      hosts:
        10.0.4.26:
        10.0.4.35:
        10.0.4.21:
    agent:
      hosts:
        # All nodes are server nodes (HA control plane + worker)
        # Leave this empty — no dedicated agent-only nodes

  vars:
    ansible_port: 22
    ansible_user: drew
    k3s_version: v1.31.12+k3s1

    # token: Set via --extra-vars or environment variable. Do not commit plaintext tokens.
    # Example: ansible-playbook site.yml -e token="<your-k3s-token>"

    api_endpoint: "{{ hostvars[groups['server'][0]]['ansible_host'] | default(groups['server'][0]) }}"

    # k3s server config — written to /etc/rancher/k3s/config.yaml on each server node
    server_config_yaml: |
      # Disable Traefik — will be deployed via ArgoCD instead
      disable:
        - traefik
      # Enable embedded etcd for HA (required when running 3 server nodes)
      cluster-init: true
