apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: crowdsec-bouncer
  namespace: crowdsec
spec:
  plugin:
    crowdsec-bouncer:
      enabled: true
      crowdsecMode: stream
      crowdsecLapiHost: crowdsec-service.crowdsec.svc.cluster.local:8080
      crowdsecLapiKey: "REPLACED — value now in SealedSecret crowdsec-bouncer-key"
      crowdsecLapiScheme: http
      forwardedHeadersTrustedIps:
        - "10.42.0.0/16"
