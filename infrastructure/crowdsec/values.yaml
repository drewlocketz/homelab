crowdsec:
  container_runtime: containerd

  config:
    notifications:
      http.yaml: |
        type: http
        name: http_default
        log_level: info
        format: |
          {{- range $Alert := . -}}
          {{- range .Decisions }}
          cs_lapi_decision{instance="crowdsec",country="{{ $Alert.Source.Cn }}",asname="{{ $Alert.Source.AsName }}",asnumber="{{ $Alert.Source.AsNumber }}",latitude="{{ $Alert.Source.Latitude }}",longitude="{{ $Alert.Source.Longitude }}",iprange="{{ $Alert.Source.Range }}",scenario="{{ .Scenario }}",type="{{ .Type }}",duration="{{ .Duration }}",scope="{{ .Scope }}",ip="{{ .Value }}"} 1
          {{- end }}
          {{- end }}
        url: http://monitoring-prometheus-pushgateway.monitoring.svc.cluster.local:9091/metrics/job/crowdsec
        method: POST
        headers:
          Content-Type: text/plain
    profiles.yaml: |
      name: default_ip_remediation
      filters:
        - Alert.Remediation == true && Alert.GetScope() == "Ip"
      decisions:
        - type: ban
          duration: 4h
      notifications:
        - http_default
      on_success: break

  lapi:
    dashboard:
      enabled: false
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: monitoring
    replicas: 1
    persistentVolume:
      data:
        enabled: true
        storageClassName: longhorn
        size: 1Gi
      config:
        enabled: true
        storageClassName: longhorn
        size: 100Mi
    env:
      - name: BOUNCER_KEY_traefik
        value: "<will-be-replaced-with-sealed-secret>"

  agent:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: monitoring
    acquisition:
      - namespace: traefik
        podName: traefik-*
        program: traefik
    env:
      - name: COLLECTIONS
        value: "crowdsecurity/traefik"
      - name: PARSERS
        value: "crowdsecurity/cri-logs"
