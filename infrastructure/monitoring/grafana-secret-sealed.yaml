# To generate this SealedSecret:
#
# 1. Create a plain secret file (do NOT commit):
#
#    apiVersion: v1
#    kind: Secret
#    metadata:
#      name: grafana-admin
#      namespace: monitoring
#    stringData:
#      admin-user: admin
#      admin-password: <YOUR_GRAFANA_PASSWORD>
#
# 2. Seal it:
#    kubeseal --format yaml < secret.yaml > grafana-secret-sealed.yaml
#
# 3. Delete the plain secret file
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  encryptedData:
    admin-user: REPLACE_WITH_KUBESEAL_OUTPUT
    admin-password: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: grafana-admin
      namespace: monitoring
