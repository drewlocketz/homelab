# To generate this SealedSecret:
#
# 1. Decide on a notification channel (Slack, email, PagerDuty, etc.)
#
# 2. Create a plain secret file (do NOT commit):
#
#    apiVersion: v1
#    kind: Secret
#    metadata:
#      name: alertmanager-notifications
#      namespace: monitoring
#    stringData:
#      slack-webhook-url: <YOUR_SLACK_WEBHOOK_URL>
#      # Add other credentials as needed for your notification channel
#
# 3. Seal it:
#    kubeseal --format yaml < secret.yaml > alertmanager-secret-sealed.yaml
#
# 4. Delete the plain secret file
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: alertmanager-notifications
  namespace: monitoring
spec:
  encryptedData:
    slack-webhook-url: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: alertmanager-notifications
      namespace: monitoring
