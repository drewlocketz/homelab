# To generate this SealedSecret:
#
# 1. Create a plain secret file (do NOT commit):
#
#    apiVersion: v1
#    kind: Secret
#    metadata:
#      name: synology-csi-client-info
#      namespace: synology-csi
#    stringData:
#      client-info.yaml: |
#        clients:
#          - host: <NAS_IP>
#            https: true
#            port: 5001
#            username: k8s-csi
#            password: <PASSWORD>
#
# 2. Seal it:
#    kubeseal --format yaml < secret.yaml > credentials-sealed.yaml
#
# 3. Delete the plain secret file
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: synology-csi-client-info
  namespace: synology-csi
spec:
  encryptedData:
    client-info.yaml: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: synology-csi-client-info
      namespace: synology-csi
